# Cue ABA endpoints for the `cue-aba` launcher branch.
#
# Committed on purpose. This branch exists so that a clone-and-build produces a
# working launcher, and so an APK handed to a colleague needs nothing but their
# own Cue sign-in — no setup steps, no per-person config.
#
# The Supabase anon key below is a public, client-facing credential enforced by
# Row-Level Security. cue/android/cue.properties commits the same value for the
# same reason.
#
# Do NOT add a service-role key, a database password, or a Cue API key
# (`cue_live_…`). An org API key grants admin-equivalent, org-wide read access to
# whoever holds the APK, which would defeat the per-person role scoping that
# makes this integration safe to hand out.

# Where the Cue app is deployed. Must be a host serving /api/native/v1/search —
# see docs/CUE_ABA_INTEGRATION.md for which Cue branch that endpoint lives on.
cue.api.base.url=https://app.cueaba.com

# Supabase project the Cue deployment authenticates against.
