android.useAndroidX=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4096m
android.builder.sdkDownload=true
org.gradle.configuration-cache=true
org.gradle.caching=true

# R8 "full mode" (the AGP 8+ default) additionally assumes non-nullability from Kotlin metadata and
# rewrites constructors on that assumption. The release build was crash-looping at MainActivity
# .onCreate with an NPE from an R8-INSERTED null check inside a constructor reached through a
# `by lazy` — the signature failure mode of that assumption being wrong for a reflectively- or
# JNI-supplied value. (The unminified debug build has not been tested against this crash, so full
# mode is the leading suspect rather than a proven cause.)
#
# Full mode buys a small extra size win; a launcher that will not start costs everything. Keep the
# standard R8 optimization/shrinking, drop only the aggressive nullability inference.
android.enableR8.fullMode=false
